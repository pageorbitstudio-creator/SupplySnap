{% extends "base.html" %}{% block page_name %}{{ 'Edit product' if product else 'Add product' }}{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">CATALOG</div><h1>{{ 'Edit product' if product else 'Add a product' }}</h1><p class="muted">Set up inventory details and replenishment defaults.</p></div><a class="btn secondary" href="{{ url_for('products') }}">← Back to products</a></div><form class="panel form-panel" method="post"><div class="form-grid"><div><label>Product name *</label><input name="name" required value="{{ product.name if product else '' }}" placeholder="e.g. A4 Copy Paper"></div><div><label>SKU *</label><input name="sku" required value="{{ product.sku if product else '' }}" placeholder="e.g. PAP-001"></div><div class="span-2"><label>Description</label><textarea name="description" rows="2">{{ product.description if product else '' }}</textarea></div><div><label>Quantity on hand</label><input type="number" min="0" name="quantity_on_hand" value="{{ product.quantity_on_hand if product else 0 }}"></div><div><label>Reorder level</label><input type="number" min="0" name="reorder_level" value="{{ product.reorder_level if product else 5 }}"></div><div><label>Default reorder quantity</label><input type="number" min="1" name="reorder_quantity" value="{{ product.reorder_quantity if product else 10 }}"></div><div><label>Unit</label><input name="unit" value="{{ product.unit if product else 'units' }}" placeholder="units, boxes, reams..."></div><div><label>Unit price (₹)</label><input type="number" min="0" step=".01" name="unit_price" value="{{ product.unit_price if product else 0 }}"></div><div><label>Supplier</label><select name="supplier_id"><option value="">No supplier assigned</option>{% for s in suppliers %}<option value="{{ s.id }}" {% if product and product.supplier_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div></div><div class="form-actions"><a class="btn secondary" href="{{ url_for('products') }}">Cancel</a><button class="btn primary">Save product →</button></div></form>{% endblock %}
